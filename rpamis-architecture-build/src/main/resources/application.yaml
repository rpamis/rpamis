spring:
  application:
    name: rpamis-architecture-build
  datasource:
    url: jdbc:mysql://localhost:3306/db?characterEncoding=utf-8
    username: root
    password: root
    type: com.zaxxer.hikari.HikariDataSource
server:
  port: 8180
  servlet:
    context-path: /rpamis-architecture-build
rpamis:
  activate: local
  exception:
    # 是否开启全局Web异常
    enabled: true
    # 是否开启全局RPC统一返回体
    rpc-pack: true
    # 是否开启Exception.class捕获
    include-exception-class: true